[package]
name = "twitch-live-alert"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Notifications Windows pour les directs Twitch par catégorie et langue"
license = "MIT"
publish = false

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
httpdate = "1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "process"] }
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Console", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
windows-registry = "0.6"
