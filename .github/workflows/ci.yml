name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Installer Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Vérifier le formatage
        run: cargo +1.99.1 fmt --all -- --check
      - name: Exécuter Clippy
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - name: Exécuter les tests
        run: cargo +1.99.1 test --locked
